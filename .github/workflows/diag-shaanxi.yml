name: Verify Shaanxi PDF page mapping

on:
  push:
    paths:
      - ".github/workflows/diag-shaanxi.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate Article 47 in committed PDF
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          PDF="source/陕西省煤矿冲击地压防治规定（试行）_原文.pdf"
          pdfinfo "$PDF" | grep -E 'Pages|File size'
          found=0
          pages=$(pdfinfo "$PDF" | awk '/^Pages:/ {print $2}')
          for i in $(seq 1 "$pages"); do
            txt=$(pdftotext -f "$i" -l "$i" -layout "$PDF" - 2>/dev/null || true)
            chars=$(printf '%s' "$txt" | tr -d '[:space:]' | wc -m)
            echo "PAGE $i TEXT_CHARS $chars"
            if printf '%s' "$txt" | tr -d '[:space:]' | grep -q '第四十七条'; then
              echo "ARTICLE_47_PAGE=$i"
              found=1
            fi
          done
          if [ "$found" -ne 1 ]; then
            echo "ARTICLE_47_NOT_FOUND_IN_TEXT_LAYER"
            exit 2
          fi
