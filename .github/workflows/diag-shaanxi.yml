name: Diagnose Shaanxi source

on:
  push:
    paths:
      - ".github/workflows/diag-shaanxi.yml"
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Verify all preview pages
        shell: bash
        run: |
          python3 -m pip install --quiet requests pillow
          python3 - <<'PY'
          import requests
          from PIL import Image
          from io import BytesIO
          base="https://cdntest.eiacloud.com/uploadPath/45d8d0c9bd1b4d98a2d4de79071232bb/files/cms/2021/5/7/a6288ddf15404f6f8061e0b65344d2a6/20221103225221103USMYF-{}.png"
          h={"User-Agent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/154 Safari/537.36"}
          s=requests.Session()
          ok=[]
          for i in range(15):
              try:
                  r=s.get(base.format(i),headers=h,timeout=12,allow_redirects=True)
                  valid=False
                  dims=None
                  if r.ok and len(r.content)>1000:
                      try:
                          im=Image.open(BytesIO(r.content)); im.load()
                          valid=True; dims=im.size
                      except Exception: pass
                  print("PAGE",i+1,"STATUS",r.status_code,"LEN",len(r.content),"TYPE",r.headers.get("content-type"),"VALID",valid,"DIMS",dims,flush=True)
                  if valid: ok.append(i)
              except Exception as e:
                  print("PAGE",i+1,"ERROR",type(e).__name__,e,flush=True)
          print("VALID_INDEXES",ok,flush=True)
          if ok[:12] != list(range(12)):
              raise SystemExit("first 12 preview pages are not all available")
          PY
