name: Restore complete high-resolution package

on:
  push:
    branches: ["codex/hires-stage-20261018-08341a6"]
    paths: [".github/workflows/restore-hires.yml", ".github/hires-payload.json"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore and verify complete package
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, concurrent.futures, hashlib, json, os, shutil, time, urllib.request, zipfile
          from pathlib import Path
          manifest = json.loads(Path(".github/hires-payload.json").read_text())
          repo = os.environ["GITHUB_REPOSITORY"]
          headers = {"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Accept": "application/vnd.github+json", "User-Agent": "coal-law-hires-restorer"}
          def download(part):
              url = "https://api.github.com/repos/" + repo + "/git/blobs/" + part["sha"]
              for attempt in range(4):
                  try:
                      with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=90) as response:
                          data = base64.b64decode(json.load(response)["content"])
                      digest = hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest()
                      assert len(data) == part["size"] and digest == part["sha"], part["name"]
                      return data
                  except Exception:
                      if attempt == 3:
                          raise
                      time.sleep(2 ** attempt)
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool:
              archive = b"".join(pool.map(download, manifest["parts"]))
          assert len(archive) == manifest["size"]
          assert hashlib.sha256(archive).hexdigest() == manifest["sha256"]
          path = Path(os.environ["RUNNER_TEMP"]) / "coal-law-hires.zip"
          path.write_bytes(archive)
          with zipfile.ZipFile(path) as package:
              assert package.testzip() is None
              assert len(package.infolist()) == 617
              for item in package.infolist():
                  target = Path(item.filename)
                  assert not target.is_absolute() and ".." not in target.parts
              for folder in ("source", "icons"):
                  if Path(folder).exists():
                      shutil.rmtree(folder)
              package.extractall(".")
          data = json.loads(Path("index-data.json").read_text())
          assert len(data["docs"]) == 24 and len(data["records"]) == 2078 and data["pages"] == 583
          assert len(list(Path("source").glob("*.pdf"))) == 24
          assert len(list(Path("pages").rglob("*.webp"))) == 583
          for document in data["docs"]:
              assert Path(document["path"]).is_file()
              for number in range(1, document["pages"] + 1):
                  assert (Path("pages") / document["id"] / (str(number).zfill(3) + ".webp")).is_file()
          for old in (".github/workflows/build-pwa.yml", ".github/workflows/restore-hires.yml", ".github/hires-payload.json"):
              Path(old).unlink(missing_ok=True)
          print("Verified: 24 PDFs, 583 page images, 2078 search records; package SHA-256 matches.")
          PY
      - name: Commit complete package to candidate branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --create codex/hires-ready-20261018-08341a6
          git add -A
          git commit -m "Upload complete high-resolution coal law upgrade: 24 PDFs and 583 page images"
          git push origin HEAD:refs/heads/codex/hires-ready-20261018-08341a6
